name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (for example v1.0.1). Leave blank to build a downloadable Actions artifact only.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.0.1 (or leave it blank for an Actions artifact only)." >&2
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_TAG" ]]; then
            build_name="${RELEASE_TAG#v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            build_name="${GITHUB_REF_NAME#v}"
          else
            build_name="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          flutter build apk --release \
            --build-name="$build_name" \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: Verify and checksum APK
        working-directory: build/app/outputs/flutter-apk
        run: |
          test -s app-release.apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload APK for direct download from this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: commuNEUcate-android-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: commuNEUcate-android-apk-${{ github.run_number }}
          path: release-assets

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        working-directory: release-assets
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must look like v1.0.1 (or leave it blank for an Actions artifact only)." >&2
              exit 1
            fi
            tag="$RELEASE_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" app-release.apk app-release.apk.sha256 \
              --clobber --repo "$REPOSITORY"
          else
            gh release create "$tag" app-release.apk app-release.apk.sha256 \
              --repo "$REPOSITORY" \
              --title "CommNEUcate $tag" \
              --generate-notes \
              --target "$SOURCE_SHA"
          fi
